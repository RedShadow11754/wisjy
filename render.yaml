# Render Blueprint — deploys the FastAPI backend as a Docker web service plus a
# managed PostgreSQL 16 instance. Deploy with Render Dashboard -> New + -> Blueprint;
# after that, every change here is applied by syncing the blueprint (see
# guide_redeploy.md for the one-time cutover to Postgres).
#
# The database and the web service MUST share a region: the internal connection
# string Render injects only resolves inside the same region.
databases:
  - name: windward-db
    databaseName: wind_procurement
    user: windward
    plan: free
    region: oregon

services:
  - type: web
    name: windward-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./Windward_API
    dockerfilePath: ./Windward_API/Dockerfile.backend
    healthCheckPath: /api/v1/system/health
    autoDeploy: true
    envVars:
      # Injected by Render as postgresql://windward:<password>@<internal-host>/wind_procurement
      # Do not paste this by hand; `fromDatabase` keeps it in sync with the instance.
      - key: DATABASE_URL
        fromDatabase:
          name: windward-db
          property: connectionString
      # Production must never quietly write to ephemeral SQLite. If the database
      # is unreachable the container now fails to start instead of serving a
      # healthy-looking API backed by a throwaway file.
      - key: ALLOW_SQLITE_FALLBACK
        value: "false"
      - key: MODEL_PKL_PATH
        value: /app/wind_procurement_model.pkl
      - key: ELEXON_API_BASE
        value: https://data.elexon.co.uk/bmrs/api/v1/datasets
      # Set this to your Vercel URL after the frontend is deployed.
      # Empty/unset means "allow any origin", which is fine for a demo.
      - key: CORS_ALLOW_ORIGINS
        sync: false
